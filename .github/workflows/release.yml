name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "AURA v__VERSION__"
          releaseBody: |
            Build automatica da CI.
            - Windows: usa l'eseguibile "AURA-portable-windows.exe" (nessuna installazione richiesta).
            - macOS: apri il .dmg e trascina AURA.app dove preferisci.
          releaseDraft: false
          prerelease: false

      - name: Attach portable Windows exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "app-v$VERSION" "src-tauri/target/release/aura.exe#AURA-portable-windows.exe" --clobber -R "${{ github.repository }}"
